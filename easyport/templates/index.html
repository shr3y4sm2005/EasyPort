<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EasyPort - Ride Comparison Tool</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      body {
        font-family: "Inter", system-ui, sans-serif;
      }
      /* Plain CSS equivalents (no Tailwind @apply at runtime) */
      .card {
        background: #ffffff;
        border: 1px solid #e5e7eb;
        border-radius: 0.75rem;
        box-shadow: 0 1px 2px rgba(16, 24, 40, 0.04);
        padding: 1.5rem;
      }
      .btn-primary {
        background: #2563eb;
        color: #ffffff;
        font-weight: 600;
        padding: 0.75rem 1.5rem;
        border-radius: 0.5rem;
        transition: filter 0.15s ease;
      }
      .btn-primary:hover {
        filter: brightness(0.95);
      }
      .btn-secondary {
        background: #f1f5f9;
        color: #334155;
        font-weight: 600;
        padding: 0.75rem 1.5rem;
        border-radius: 0.5rem;
        transition: filter 0.15s ease;
      }
      .btn-secondary:hover {
        filter: brightness(0.97);
      }
      .input-field {
        width: 100%;
        padding: 0.75rem 1rem;
        border: 1px solid #d1d5db;
        border-radius: 0.5rem;
      }
      .input-field:focus {
        outline: 2px solid #93c5fd;
        outline-offset: 0;
        border-color: transparent;
      }
    </style>
  </head>
  <body class="min-h-screen bg-gray-50">
    <header class="bg-white shadow-sm border-b border-gray-100">
      <div class="container mx-auto px-4 py-4">
        <div class="flex items-center justify-between">
          <div class="flex items-center space-x-3">
            <div
              class="w-10 h-10 bg-gradient-to-br from-blue-500 to-indigo-600 rounded-lg flex items-center justify-center"
            >
              <span class="text-white text-xl font-bold">🚗</span>
            </div>
            <div>
              <h1 class="text-2xl font-bold text-gray-900">EasyPort</h1>
              <p class="text-sm text-gray-500">Smart Ride Comparison</p>
            </div>
          </div>
          <nav class="hidden md:flex items-center space-x-6">
            {% if user %}
            <span class="text-gray-700">Hi, {{ user.name.split(' ')[0] }}</span>
            <form action="{{ url_for('logout') }}" method="post">
              <button
                type="submit"
                class="text-red-600 hover:text-red-700 transition-colors"
              >
                Logout
              </button>
            </form>
            {% else %}
            <a
              href="{{ url_for('login') }}"
              class="text-gray-600 hover:text-blue-600 transition-colors"
              >Login</a
            >
            <a
              href="{{ url_for('register') }}"
              class="text-gray-600 hover:text-blue-600 transition-colors"
              >Register</a
            >
            {% endif %}
          </nav>
        </div>
      </div>
    </header>

    <main class="container mx-auto px-4 py-8">
      <div class="max-w-4xl mx-auto">
        <!-- Form -->
        <div class="card">
          <div class="text-center mb-6">
            <h2 class="text-2xl font-bold text-gray-900 mb-2">
              Find Your Perfect Ride
            </h2>
            <p class="text-gray-600">
              Compare prices across multiple ride-sharing apps
            </p>
          </div>

          <form id="ride-form" class="space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
              <div>
                <label
                  for="source"
                  class="block text-sm font-medium text-gray-700 mb-2"
                  >Pickup Location</label
                >
                <input
                  id="source"
                  type="text"
                  class="input-field"
                  placeholder="Enter pickup address"
                  required
                />
                <div
                  id="src-suggest"
                  class="mt-1 hidden bg-white border border-gray-200 rounded-md shadow-md"
                ></div>
              </div>
              <div>
                <label
                  for="destination"
                  class="block text-sm font-medium text-gray-700 mb-2"
                  >Drop Location</label
                >
                <input
                  id="destination"
                  type="text"
                  class="input-field"
                  placeholder="Enter destination address"
                  required
                />
                <div
                  id="dst-suggest"
                  class="mt-1 hidden bg-white border border-gray-200 rounded-md shadow-md"
                ></div>
              </div>
            </div>
            <div>
              <label
                for="passengers"
                class="block text-sm font-medium text-gray-700 mb-2"
                >Number of Passengers</label
              >
              <select id="passengers" class="input-field w-full md:w-48">
                <option value="1">1 Passenger</option>
                <option value="2">2 Passengers</option>
                <option value="3">3 Passengers</option>
                <option value="4">4 Passengers</option>
                <option value="5">5 Passengers</option>
                <option value="6">6 Passengers</option>
              </select>
            </div>
            <button type="submit" class="btn-primary w-full md:w-auto md:px-12">
              🚗 Find Rides
            </button>
          </form>

          <div class="mt-6 pt-6 border-t border-gray-100">
            <div
              class="flex items-center justify-center space-x-8 text-sm text-gray-500"
            >
              <div class="flex items-center space-x-2">
                <span class="w-2 h-2 bg-green-500 rounded-full"></span
                ><span>Real-time pricing</span>
              </div>
              <div class="flex items-center space-x-2">
                <span class="w-2 h-2 bg-blue-500 rounded-full"></span
                ><span>Multiple apps</span>
              </div>
              <div class="flex items-center space-x-2">
                <span class="w-2 h-2 bg-purple-500 rounded-full"></span
                ><span>Instant booking</span>
              </div>
            </div>
          </div>
        </div>

        <!-- Results container -->
        <div id="results" class="mt-8 space-y-6"></div>
      </div>
    </main>

    <script>
      const form = document.getElementById("ride-form");
      const results = document.getElementById("results");
      const srcInput = document.getElementById("source");
      const dstInput = document.getElementById("destination");
      const srcSuggest = document.getElementById("src-suggest");
      const dstSuggest = document.getElementById("dst-suggest");

      let state = {
        sortBy: "price",
        filterBy: "all",
        vehicleCategory: "all",
        accessibility: "all",
        data: null,
      };

      // Simple debounced geocode suggest
      function debounce(fn, wait) {
        let t;
        return (...args) => {
          clearTimeout(t);
          t = setTimeout(() => fn(...args), wait);
        };
      }
      async function suggest(q, targetBox, targetInput) {
        targetBox.innerHTML = "";
        targetBox.classList.add("hidden");
        if (!q || q.length < 3) return;
        try {
          const res = await fetch(`/api/geocode?q=${encodeURIComponent(q)}`);
          const data = await res.json();
          const items = (data.results || []).slice(0, 5);
          if (items.length === 0) return;
          targetBox.classList.remove("hidden");
          items.forEach((it) => {
            const el = document.createElement("button");
            el.type = "button";
            el.className = "block w-full text-left px-3 py-2 hover:bg-gray-50";
            el.textContent = it.label;
            el.addEventListener("click", () => {
              targetInput.value = it.label;
              targetBox.classList.add("hidden");
            });
            targetBox.appendChild(el);
          });
        } catch (e) {
          /* ignore */
        }
      }
      const debouncedSrc = debounce(
        () => suggest(srcInput.value, srcSuggest, srcInput),
        300
      );
      const debouncedDst = debounce(
        () => suggest(dstInput.value, dstSuggest, dstInput),
        300
      );
      srcInput.addEventListener("input", debouncedSrc);
      dstInput.addEventListener("input", debouncedDst);
      document.addEventListener("click", (e) => {
        if (!srcSuggest.contains(e.target) && e.target !== srcInput) {
          srcSuggest.classList.add("hidden");
        }
        if (!dstSuggest.contains(e.target) && e.target !== dstInput) {
          dstSuggest.classList.add("hidden");
        }
      });

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        results.innerHTML = `<div class="text-center">
          <div class="inline-block animate-spin rounded-full h-8 w-8 border-b-2 border-blue-600"></div>
          <p class="mt-2 text-gray-600">Finding the best rides for you...</p>
        </div>`;
        const payload = {
          source: document.getElementById("source").value,
          destination: document.getElementById("destination").value,
          passengers: parseInt(document.getElementById("passengers").value, 10),
        };
        try {
          const res = await fetch("/api/rides", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
          });
          if (!res.ok) throw new Error("Request failed");
          state.data = await res.json();
          renderAll();
        } catch (err) {
          results.innerHTML = `<div class="p-4 bg-red-50 border border-red-200 rounded-lg">
            <div class="flex items-center space-x-2"><span class="text-red-500">⚠️</span><p class="text-red-700">Unable to fetch ride data. Please try again.</p></div>
          </div>`;
        }
      });

      function renderAll() {
        const d = state.data;
        if (!d) return;
        // compute sorted and filtered rides
        const sorted = [...d.rides].sort((a, b) =>
          state.sortBy === "price"
            ? a.price - b.price
            : state.sortBy === "time"
            ? a.estimatedTime - b.estimatedTime
            : b.rating - a.rating
        );
        const filtered = sorted.filter((r) => {
          // Basic filters
          let passBasic =
            state.filterBy === "all"
              ? true
              : state.filterBy === "surge"
              ? r.surge
              : state.filterBy === "no-surge"
              ? !r.surge
              : state.filterBy === "recommended"
              ? r.recommended
              : state.filterBy === "accessible"
              ? (r.accessibility || []).some((a) => a !== "Standard Access")
              : true;

          // Vehicle category filter
          let passCategory =
            state.vehicleCategory === "all"
              ? true
              : r.vehicleCategory === state.vehicleCategory;

          // Accessibility filter
          let passAccessibility =
            state.accessibility === "all"
              ? true
              : state.accessibility === "wheelchair"
              ? (r.accessibility || []).includes("Wheelchair Accessible")
              : state.accessibility === "standard"
              ? (r.accessibility || []).includes("Standard Access")
              : true;

          return passBasic && passCategory && passAccessibility;
        });
        const bestRide = sorted.find((r) => r.recommended) || sorted[0];
        const avgPrice = Math.round(
          sorted.reduce((s, r) => s + r.price, 0) / Math.max(sorted.length, 1)
        );

        results.innerHTML = "";

        // Summary card
        results.appendChild(
          html(`<div class="card border border-gray-100">
          <div class="grid grid-cols-1 md:grid-cols-5 gap-4 text-center">
            <div><p class="text-sm text-gray-600">Route</p><p class="font-semibold text-gray-900">${
              d.source
            } → ${d.destination}</p></div>
            <div><p class="text-sm text-gray-600">Passengers</p><p class="font-semibold text-gray-900">${
              d.passengers
            }</p></div>
            <div><p class="text-sm text-gray-600">Best Price</p><p class="font-bold text-green-600 text-lg">₹${
              bestRide.price
            }</p></div>
            <div><p class="text-sm text-gray-600">Avg Price</p><p class="font-semibold text-gray-900">₹${avgPrice}</p></div>
            <div><p class="text-sm text-gray-600">Recommended</p><p class="font-semibold text-blue-600">${
              sorted.filter((r) => r.recommended).length
            } vehicles</p></div>
          </div>
        </div>`)
        );

        // Best deal highlight
        results.appendChild(
          html(`<div class="card border border-gray-200">
          <div class="flex items-center justify-between">
            <div class="flex items-center space-x-4">
              <div class="w-12 h-12 ${
                bestRide.recommended ? "bg-blue-100" : "bg-green-100"
              } rounded-full flex items-center justify-center"><span class="text-2xl">${
            bestRide.appIcon
          }</span></div>
              <div>
                <h3 class="text-lg font-bold text-gray-900">${
                  bestRide.recommended ? "⭐ Smart Pick" : "Best Deal"
                }: ${bestRide.app} ${bestRide.vehicleType}</h3>
                <p class="${
                  bestRide.recommended ? "text-blue-600" : "text-green-600"
                } font-semibold">₹${bestRide.price} • ${
            bestRide.estimatedTime
          } min</p>
                ${
                  bestRide.recommended
                    ? `<p class="text-blue-600 text-sm mt-1">Perfect for ${
                        d.passengers
                      } passenger${d.passengers > 1 ? "s" : ""}</p>`
                    : ""
                }
              </div>
            </div>
            <a class="btn-primary" href="/book?dl=${encodeURIComponent(
              bestRide.deepLink
            )}&web=${encodeURIComponent(
            bestRide.app === "Uber"
              ? "https://m.uber.com"
              : bestRide.app === "Ola"
              ? "https://book.olacabs.com"
              : bestRide.app === "Rapido"
              ? "https://rapido.bike"
              : bestRide.app === "Meru"
              ? "https://merucabs.com"
              : "https://indrive.com"
          )}&label=${encodeURIComponent(
            bestRide.app + " " + bestRide.vehicleType
          )}&s=${encodeURIComponent(d.source)}&t=${encodeURIComponent(
            d.destination
          )}">Book Now</a>
          </div>
        </div>`)
        );

        // Filters and sorting
        const controls =
          html(`<div class="card"><div class="flex flex-col md:flex-row md:items-start md:justify-between space-y-4 md:space-y-0">
          <h3 class="text-lg font-semibold text-gray-900">Filter & Sort Rides</h3>
          <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
            <select id="filterBy" class="px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:border-transparent">
              <option value="all">All rides</option>
              <option value="recommended">Recommended</option>
              <option value="no-surge">No surge</option>
              <option value="surge">Surge pricing</option>
              <option value="accessible">Accessible</option>
            </select>
            <select id="vehicleCategory" class="px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:border-transparent">
              <option value="all">All categories</option>
              <option value="Economy">Economy</option>
              <option value="Premium">Premium</option>
              <option value="Large">Large/SUV</option>
              <option value="Two-Wheeler">Two-Wheeler</option>
              <option value="Three-Wheeler">Three-Wheeler</option>
              <option value="Accessible">Accessible</option>
            </select>
            <select id="accessibility" class="px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:border-transparent">
              <option value="all">All accessibility</option>
              <option value="standard">Standard access</option>
              <option value="wheelchair">Wheelchair friendly</option>
            </select>
            <select id="sortBy" class="px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:border-transparent">
              <option value="price">Sort by Price</option>
              <option value="time">Sort by Time</option>
              <option value="rating">Sort by Rating</option>
            </select>
          </div>
        </div></div>`);
        results.appendChild(controls);
        controls.querySelector("#filterBy").value = state.filterBy;
        controls.querySelector("#vehicleCategory").value =
          state.vehicleCategory;
        controls.querySelector("#accessibility").value = state.accessibility;
        controls.querySelector("#sortBy").value = state.sortBy;
        controls.querySelector("#filterBy").addEventListener("change", (e) => {
          state.filterBy = e.target.value;
          renderAll();
        });
        controls
          .querySelector("#vehicleCategory")
          .addEventListener("change", (e) => {
            state.vehicleCategory = e.target.value;
            renderAll();
          });
        controls
          .querySelector("#accessibility")
          .addEventListener("change", (e) => {
            state.accessibility = e.target.value;
            renderAll();
          });
        controls.querySelector("#sortBy").addEventListener("change", (e) => {
          state.sortBy = e.target.value;
          renderAll();
        });

        // Ride cards
        const grid = document.createElement("div");
        grid.className = "grid grid-cols-1 md:grid-cols-2 gap-4";
        filtered.forEach((ride) => {
          grid.appendChild(
            html(`<div class="card ${
              ride.surge ? "border-orange-200 bg-orange-50" : ""
            } ${ride.recommended ? "border-green-300 bg-green-50" : ""}">
            <div class="flex items-start justify-between mb-4">
              <div class="flex items-center space-x-3">
                <div class="w-12 h-12 bg-white rounded-full flex items-center justify-center shadow-sm">
                  <span class="text-2xl">${ride.appIcon}</span>
                </div>
                <div>
                  <h3 class="font-semibold text-gray-900">${ride.app}</h3>
                  <p class="text-sm text-gray-600">${ride.vehicleType}</p>
                  ${
                    ride.vehicleCategory
                      ? `<span class="text-xs text-blue-600 font-medium">${ride.vehicleCategory}</span>`
                      : ""
                  }
                  ${
                    ride.recommended
                      ? `<span class="inline-flex items-center px-2 py-1 rounded-full text-xs font-medium bg-green-100 text-green-800 mt-1">⭐ Recommended for ${
                          d.passengers
                        } passenger${d.passengers > 1 ? "s" : ""}</span>`
                      : ""
                  }
                </div>
              </div>
              <div class="flex flex-col items-end space-y-2">
                ${
                  ride.recommended
                    ? `<div class="bg-green-100 text-green-800 text-xs px-2 py-1 rounded-full font-medium">Best Match</div>`
                    : ""
                }
                ${
                  ride.surge
                    ? `<div class="bg-orange-100 text-orange-800 text-xs px-2 py-1 rounded-full font-medium">Surge</div>`
                    : ""
                }
              </div>
            </div>
            <div class="space-y-3 mb-4">
              <div class="flex items-center justify-between"><span class="text-sm text-gray-600">Price</span><span class="text-2xl font-bold text-gray-900">₹${
                ride.price
              }</span></div>
              <div class="grid grid-cols-3 gap-4 text-sm">
                <div class="flex items-center space-x-2"><span class="text-gray-500">⏱️</span><span class="text-gray-700">${
                  ride.estimatedTime
                } min</span></div>
                <div class="flex items-center space-x-2"><span class="text-gray-500">📏</span><span class="text-gray-700">${
                  ride.distance
                } km</span></div>
                <div class="flex items-center space-x-2"><span class="text-gray-500">👥</span><span class="text-gray-700">Max ${
                  ride.maxPassengers || 4
                }</span></div>
              </div>
              <div class="grid grid-cols-2 gap-4 text-sm">
                <div class="flex items-center space-x-2"><span class="text-gray-500">⭐</span><span class="text-gray-700">${
                  ride.rating
                }</span><span class="text-xs text-gray-500">(${Math.floor(
              Math.random() * 1000 + 100
            )} reviews)</span></div>
                <div class="flex items-center space-x-2"><span class="text-gray-500">💰</span><span class="text-gray-700">₹${
                  ride.cancellationFee || 20
                } fee</span></div>
              </div>
              ${
                ride.accessibility && ride.accessibility.length > 0
                  ? `
                <div class="mt-2">
                  <div class="flex flex-wrap gap-1">
                    ${ride.accessibility
                      .map((feature) =>
                        feature !== "Standard Access"
                          ? `<span class="inline-flex items-center px-2 py-1 rounded-full text-xs font-medium bg-blue-100 text-blue-800">♿ ${feature}</span>`
                          : ""
                      )
                      .join("")}
                  </div>
                </div>
              `
                  : ""
              }
            </div>
            <div class="flex space-x-2">
              <a class="btn-primary flex-1" href="/book?dl=${encodeURIComponent(
                ride.deepLink
              )}&web=${encodeURIComponent(
              ride.app === "Uber"
                ? "https://m.uber.com"
                : ride.app === "Ola"
                ? "https://book.olacabs.com"
                : ride.app === "Rapido"
                ? "https://rapido.bike"
                : ride.app === "Meru"
                ? "https://merucabs.com"
                : "https://indrive.com"
            )}&label=${encodeURIComponent(
              ride.app + " " + ride.vehicleType
            )}&s=${encodeURIComponent(d.source)}&t=${encodeURIComponent(
              d.destination
            )}">Book Now</a>
              <button class="btn-secondary px-4" title="Copy details" onclick="navigator.clipboard.writeText('${
                ride.app
              } ${ride.vehicleType} - ₹${ride.price} (${
              ride.estimatedTime
            } min)')">📋</button>
            </div>
            <div class="mt-4 pt-4 border-t border-gray-100">
              <div class="flex items-center justify-between text-xs text-gray-500">
                <span>Estimated arrival: ${new Date(
                  Date.now() + ride.estimatedTime * 60000
                ).toLocaleTimeString()}</span>
                <span class="text-green-600">Available now</span>
              </div>
            </div>
          </div>`)
          );
        });
        results.appendChild(grid);

        if (filtered.length === 0) {
          results.appendChild(
            html(`<div class="card text-center py-12">
            <div class="text-6xl mb-4">🚫</div>
            <h3 class="text-lg font-semibold text-gray-900 mb-2">No rides found</h3>
            <p class="text-gray-600">Try adjusting your filters or search criteria</p>
          </div>`)
          );
        }
      }

      function html(str) {
        const t = document.createElement("template");
        t.innerHTML = str.trim();
        return t.content.firstChild;
      }
    </script>
  </body>
</html>
